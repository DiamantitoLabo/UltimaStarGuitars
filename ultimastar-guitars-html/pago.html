<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago | UltimaStar Guitars</title>
<meta name="description" content="Datos para realizar la compra.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#contenido">Saltar al contenido principal</a>
<header class="site-header">
  <a class="logo-link" href="index.html"><img src="img/logo-ultimastar.png" width="847" height="170" alt="UltimaStar Guitars, ir a la página principal"></a>
  
</header>

<main id="contenido" tabindex="-1">
<div class="checkout" data-cart>
  <section aria-labelledby="checkout-heading">
    <h1 id="checkout-heading">Datos para realizar la compra</h1>
    <form id="checkout-form" novalidate>
      <div class="form-grid">
        <div class="field span-3">
          <label for="nombre">Primer Nombre</label>
          <input id="nombre" name="nombre" type="text" autocomplete="cc-given-name" placeholder="Nombre del titular  de la tarjeta">
        </div>
        <div class="field span-3">
          <label for="apellido">Apellido</label>
          <input id="apellido" name="apellido" type="text" autocomplete="cc-family-name" placeholder="Apellido del titular de la tarjeta">
        </div>
        <div class="field span-6 with-icon">
          <label for="tarjeta">Numero de la tarjeta</label>
          <input id="tarjeta" name="tarjeta" type="text" inputmode="numeric" autocomplete="cc-number" placeholder="Numero de 16 dígitos al frente de la tarjeta">
          <svg class="trail" width="26" height="16" viewBox="0 0 26 16" aria-hidden="true" focusable="false"><circle cx="9" cy="8" r="6" fill="#EB001B"/><circle cx="17" cy="8" r="6" fill="#F79E1B" fill-opacity=".9"/></svg>
        </div>
        <div class="field span-2">
          <label for="mes">Mes de vencimiento de la tarjeta</label>
          <select id="mes" name="mes" autocomplete="cc-exp-month">
          <option value="">Seleccionar</option>
          <option value="01">01</option>
          <option value="02">02</option>
          <option value="03">03</option>
          <option value="04">04</option>
          <option value="05">05</option>
          <option value="06">06</option>
          <option value="07">07</option>
          <option value="08">08</option>
          <option value="09">09</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="field span-2">
          <label for="anio">Año de vencimiento de la tarjeta</label>
          <select id="anio" name="anio" autocomplete="cc-exp-year">
          <option value="">Seleccionar</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
          <option value="2029">2029</option>
          <option value="2030">2030</option>
          <option value="2031">2031</option>
          <option value="2032">2032</option>
          <option value="2033">2033</option>
          <option value="2034">2034</option>
          <option value="2035">2035</option>
          <option value="2036">2036</option>
          </select>
          <svg class="chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6" fill="none" stroke="#1D1B20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="field span-2 with-icon">
          <label for="cvc">CVC</label>
          <input id="cvc" name="cvc" type="text" inputmode="numeric" autocomplete="cc-csc" placeholder="Pin de seguridad" aria-describedby="cvc-hint">
          <svg class="trail" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="8.5" fill="#E6E0E9" stroke="#49454F"/><path d="M10 5.5v6" stroke="#49454F" stroke-width="1.8"/><circle cx="10" cy="14.2" r="1.1" fill="#49454F"/></svg>
          <span id="cvc-hint" class="visually-hidden">Código de 3 o 4 dígitos al reverso de la tarjeta</span>
        </div>
        <div class="field span-6">
          <label for="correo">Correo Electrónico</label>
          <input id="correo" name="correo" type="email" autocomplete="email" placeholder="Ingresa tu correo electrónico">
        </div>
      </div>
      <div class="button-row">
        <button type="submit" class="btn-red bold">Comprar</button>
        <a class="btn-red bold" href="carrito.html">Cancelar</a>
      </div>
    </form>
  </section>
  <section class="summary" aria-labelledby="summary-heading">
    <h2 class="summary-title" id="summary-heading" tabindex="-1" data-focus-target>Productos que vas a comprar:</h2>
    <div class="cart-panel">
      <ul data-cart-list hidden></ul>
      <p class="empty" data-cart-empty>Actualmente no tienes productos en tu carrito</p>
    </div>
    <p class="total">Total: <span data-cart-total>$0.00</span></p>
  </section>
</div>
<dialog class="dialog" id="dlg-remove" aria-labelledby="dlg-remove-title">
  <div class="dialog-inner">
    <button type="button" class="close" data-close aria-label="Cerrar"><span aria-hidden="true">X</span></button>
    <h2 id="dlg-remove-title">¿Está seguro que desea eliminar el elemento del carrito?</h2>
    <div class="dialog-buttons">
      <button type="button" class="btn-white outlined" data-confirm>Si</button>
      <button type="button" class="btn-white" data-close autofocus>No</button>
    </div>
  </div>
</dialog>
<p id="cart-status" class="visually-hidden" role="status" aria-live="polite"></p>
</main>
</body>
</html>
